.tool-btn {

/* ===== パート見出し ===== */

.choice .mark {

}

/* ===== 結果バナー ===== */

  .choice.correct .mark, .choice.wrong .mark { background: none; color: #000; }
  .choice.dim { opacity: 1; }
  .verdict-line { display: none !important; }

  /* 解答欄: 問題行の右端に重ねて縦スペースを使わない（右端に張り付けると

  .ans-space {
    display: block; position: absolute; top: 0; right: 5mm;
    font-size: 9.5pt; color: #000; font-weight: 700;
  }
  .ans-space .box {
    display: inline-block; min-width: 13mm; border: 1.2pt solid #000;
    border-radius: 2mm; height: 8mm; vertical-align: middle; margin-left: 1.5mm;
  }

  /* 解説: 通常印刷では隠す。解答モード印刷で出す */
  .expl { display: none; background: #f2f2f2; border-left: 3pt solid #000; color: #000; font-size: 8.5pt; line-height: 1.5; margin: 0.8mm 0 0 8mm; padding: 1.2mm 2.5mm; border-radius: 0; }
  .expl b { color: #000; }
  body.show-answers .expl { display: block; }
  body.show-answers .choice.is-answer { background: none; border: none; box-shadow: none; }
  body.show-answers .choice.is-answer .mark { background: #000; color: #fff; border-radius: 50%; width: 5.5mm; height: 5.5mm; display: inline-flex; align-items: center; justify-content: center; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  body.show-answers .choice.is-answer .mark::after { content: ''; }
  body.show-answers .choice.is-answer .ctext { text-decoration: underline; text-underline-offset: 2px; font-weight: 800; }
  body.show-answers .ans-space .box { position: relative; }
  body.show-answers .ans-space .box::before {
    content: attr(data-ans);
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 11pt;
  }

  /* 改ページは強制せず、行間・間隔をゆったりとった自然分割にまかせる
     （余白があるのに詰める、を避ける）。見出しは次の問題と必ず同じページに。 */

  /* 記述課題: 画面用textareaは隠し、罫線つき解答欄を出す（広めに） */
  .desc-card .qtext { padding-right: 0; }
  .hint-words { margin: 3mm 0 0 8mm; font-size: 9.5pt; color: #000; }
  .hint-chip { border: 1pt solid #000; background: none; color: #000; border-radius: 2mm; padding: 1px 2.5mm; font-size: 9.5pt; }
  .desc-input, .reveal-btn { display: none !important; }
  .write-lines { display: block; margin: 5mm 0 0 8mm; }
  .write-lines span {
    display: block; height: 10mm; border-bottom: 0.8pt solid #000;
    margin-right: 4mm;
  }
  .expl.model { display: none; }
  body.show-answers .expl.model { display: block; }
  .check-points { border-top: 1px dashed #999; }
  .check-points b { color: #000; }
}

<script>
/* ============================================================
   問題データ
   part: 見出し / q: 問題文 / c: 選択肢 / a: 正解index / e: 解説
   kana: 選択肢記号
   ============================================================ */
const KANA = ['A', 'B', 'C', 'D'];
const MARU = ['○', '×'];

const PARTS = [
  { id: 1, badge: 'Part 1', title: 'What happens to the mass? 5 patterns', note: 'Picture each experiment and choose' },
  { id: 2, badge: 'Part 2', title: 'Reasons & mechanism', note: 'Think in terms of atoms!' },
  { id: 3, badge: 'Part 3', title: 'Try the calculations', note: 'The total is the same before and after!' },
  { id: 4, badge: 'Part 4', title: 'True or False', note: 'Watch for tricks!' },
  { id: 5, badge: 'Part 5', title: 'Explain it ✍️', note: 'Write your idea in your own words' },
];

const QUESTIONS = [
  // ===== パート1: プリントの5パターン =====
  {
    part: 1,
    q: '<b>Copper powder</b> on a combustion dish was heated <b>in open air</b>. What happens to the mass?',
    c: ['Increases', 'Decreases', 'Stays the same'],
    a: 0,
    e: 'It gets heavier by exactly the amount of <b>oxygen from the air that bonds with the copper</b> (copper + oxygen → copper oxide). Same mechanism as the steel wool (iron) in the simulation.',
  },
  {
    part: 1,
    q: 'Copper was placed in a round-bottom flask, <b>sealed with a rubber stopper</b>, and heated. What happens to the mass?',
    c: ['Increases', 'Decreases', 'Stays the same'],
    a: 2,
    e: 'The oxygen that bonds with the copper is <b>already inside the flask from the start</b>. Since nothing enters or leaves, the total mass stays the same.',
  },
  {
    part: 1,
    q: 'Dilute sulfuric acid was mixed with barium hydroxide solution, and a <b>white precipitate</b> (barium sulfate) formed. What happens to the mass?',
    c: ['Increases', 'Decreases', 'Stays the same'],
    a: 2,
    e: 'No gas is produced in this reaction. Only the <b>combination of atoms changes</b>, so the mass stays the same even without a lid.',
  },
  {
    part: 1,
    q: 'Inside <b>a sealed jar</b>, hydrochloric acid was added to sodium bicarbonate, and carbon dioxide was produced. What happens to the mass?',
    c: ['Increases', 'Decreases', 'Stays the same'],
    a: 2,
    e: 'The carbon dioxide that was produced is also <b>trapped inside the jar</b>, so the total mass stays the same.',
  },
  {
    part: 1,
    q: 'Inside <b>an open beaker (no lid)</b>, hydrochloric acid was added to sodium bicarbonate, and carbon dioxide was produced. What happens to the mass?',
    c: ['Increases', 'Decreases', 'Stays the same'],
    a: 1,
    e: 'It gets lighter by exactly the amount of carbon dioxide that <b>escapes into the air</b>. The only difference from question 4 is "is there a lid?"',
  },
  // ===== パート2: 理由と仕組み =====
  {
    part: 2,
    q: 'Which is the most correct reason why the <b>Law of Conservation of Mass</b> holds?',
    c: [
      'The combination of atoms changes, but the kinds and numbers of atoms do not change',
      'New atoms are created and old atoms disappear',
      'The atoms gradually get smaller during the chemical change',
      'No gas is produced in a chemical change',
    ],
    a: 0,
    e: 'A chemical change is a <b>rearrangement</b> of atoms. Atoms are <b>never created or destroyed</b>, so the kinds and numbers — and therefore the mass — stay the same.',
  },
  {
    part: 2,
    q: 'In question 1, what is the <b>reason the mass increased</b> when copper was heated in open air?',
    c: [
      'The number of copper atoms increased',
      'It got heavier by the amount of heat that was added',
      'Oxygen from the air bonded with the copper',
      'The copper atoms themselves turned into heavier atoms',
    ],
    a: 2,
    e: 'The extra mass is really the <b>mass of the oxygen that bonded</b>. Oxygen is invisible, but it definitely has mass.',
  },
  {
    part: 2,
    q: 'In question 5, what is the <b>reason the mass decreased</b> in the open beaker (no lid)?',
    c: [
      'The carbon dioxide disappeared into nothing',
      'The carbon dioxide that was produced escaped into the air',
      'All of the hydrochloric acid evaporated',
      'The number of atoms decreased in the reaction',
    ],
    a: 1,
    e: 'The CO₂ <b>did not disappear — it just escaped into the air</b>. If you include the gas that escaped, the mass is conserved.',
  },
  {
    part: 2,
    q: 'After the experiment in question 4 (the sealed jar), if you <b>open the lid</b> and leave it for a while, what happens to the total mass?',
    c: ['Increases', 'Decreases', 'Stays the same', 'Increases at first, then returns to the original'],
    a: 1,
    e: 'When you open the lid, the <b>CO₂ that was trapped escapes outside</b>, so the mass decreases by that amount.',
  },
  // ===== パート3: 計算 =====
  {
    part: 3,
    q: 'When <b>10 g</b> of dilute sulfuric acid was mixed with <b>17 g</b> of barium hydroxide solution, <b>23 g</b> of barium sulfate and some water formed. How many grams of water formed?',
    c: ['2 g', '4 g', '6 g', '13 g'],
    a: 1,
    e: 'The total before the reaction is 10 + 17 = <b>27 g</b>. The total after must also be 27 g, so the water is 27 − 23 = <b>4 g</b>.',
  },
  {
    part: 3,
    q: 'Sodium bicarbonate and hydrochloric acid were reacted inside a sealed container. The total before the reaction was <b>58.0 g</b>. After the reaction, the lid was opened and after a while it became <b>57.4 g</b>. How many grams of carbon dioxide escaped?',
    c: ['0.4 g', '0.6 g', '1.6 g', '57.4 g'],
    a: 1,
    e: 'The <b>mass lost = the mass of the gas that escaped</b>. 58.0 − 57.4 = <b>0.6 g</b>.',
  },
  {
    part: 3,
    q: '<b>2.0 g</b> of limestone was put into <b>10.0 g</b> of dilute hydrochloric acid (no lid). Gas was produced, and the total after the reaction was <b>11.2 g</b>. How many grams of gas were produced?',
    c: ['0.8 g', '1.2 g', '2.0 g', '8.0 g'],
    a: 0,
    e: 'The total before the reaction is 2.0 + 10.0 = <b>12.0 g</b>. 12.0 − 11.2 = <b>0.8 g</b> is the gas that escaped into the air.',
  },
  // ===== パート4: ○× =====
  {
    part: 4,
    q: '"If you dissolve 60 g of sugar in 200 g of water, the total mass will be 260 g even after the sugar dissolves and can no longer be seen."',
    c: ['○ True', '× False'],
    a: 0,
    e: 'Even though the sugar <b>can no longer be seen once it dissolves, its particles have not disappeared</b>, so the total is exactly 60 + 200 = 260 g. The idea of conservation of mass <b>also holds for physical changes</b> such as dissolving or changes of state.',
  },
  {
    part: 4,
    q: '"In a reaction where gas escapes, the Law of Conservation of Mass does not hold."',
    c: ['○ True', '× False'],
    a: 1,
    e: 'The reading on the scale goes down, but <b>if you include the gas that escaped, the mass is conserved</b>. The Law of Conservation of Mass holds for <b>every chemical change</b>.',
  },
  // ===== パート5: 説明（記述）=====
  {
    part: 5,
    type: 'desc',
    q: 'Even though it is the same reaction (sodium bicarbonate + hydrochloric acid), the mass stayed the same in <b>the sealed jar</b> (question 4) but decreased in <b>the open beaker with no lid</b> (question 5). Explain why this "difference" occurs.',
    hint: ['carbon dioxide', 'the air', 'leaves', 'trap'],
    model: 'In both experiments, carbon dioxide is produced. In <b>the sealed jar</b>, the jar <b>traps</b> the carbon dioxide inside, so the total mass does not change. In <b>the open beaker with no lid</b>, the carbon dioxide <b>leaves</b> into <b>the air</b>, so the mass decreases by that amount. (The atoms themselves do not disappear, so if you include the gas that escaped, the mass is conserved.)',
    points: ['Mentions that carbon dioxide (gas) is produced in both cases', 'States that sealed = the gas is trapped inside → stays the same', 'States that no lid = the gas leaves into the air → decreases'],
  },
];

/* ============================================================
   レンダリング
   ============================================================ */
const quizEl = document.getElementById('quiz');
let answered = 0, correct = 0;
const TOTAL = QUESTIONS.filter(q => !q.type).length;   // 自動採点する選択問題の数（記述は除く）

function render() {
  let html = '';
  let lastPart = 0;
  QUESTIONS.forEach((Q, qi) => {
    if (Q.part !== lastPart) {
      const P = PARTS.find(p => p.id === Q.part);
      html += `<div class="part-head" id="part${P.id}-head">
        <span class="badge">${P.badge}</span>
        <span class="pt">${P.title}</span>
        <span class="note">${P.note}</span>
      </div>`;
      lastPart = Q.part;
    }
    if (Q.type === 'desc') {
      html += `<div class="qcard desc-card" data-qi="${qi}">
        <div class="qrow"><span class="qnum">${qi + 1}</span><span class="qtext">${Q.q}</span></div>
        <div class="hint-words">💬 Words to use:${Q.hint.map(h => `<span class="hint-chip">${h}</span>`).join('')}</div>
        <textarea class="desc-input" rows="3" placeholder="Write your idea here…"></textarea>
        <div class="write-lines"><span></span><span></span><span></span><span></span><span></span></div>
        <button class="reveal-btn" data-qi="${qi}">✏️ Show model answer</button>
        <div class="expl model" id="expl-${qi}">💡 Model answer: ${Q.model}
          <div class="check-points"><b>Marking points</b><ul>${Q.points.map(p => `<li>${p}</li>`).join('')}</ul></div>
        </div>
      </div>`;
      return;
    }
    const kana = (Q.part === 4) ? Q.c.map((_, i) => MARU[i]) : Q.c.map((_, i) => KANA[i]);
    html += `<div class="qcard" data-qi="${qi}">
      <div class="qrow"><span class="qnum">${qi + 1}</span><span class="qtext">${Q.q}</span></div>
      <div class="choices">
        ${Q.c.map((c, ci) => `
          <button class="choice ${ci === Q.a ? 'is-answer' : ''}" data-ci="${ci}">
            <span class="mark">${kana[ci]}</span><span class="ctext">${c}</span>
          </button>`).join('')}
      </div>
      <span class="ans-space">Answer<span class="box" data-ans="${kana[Q.a]}"></span></span>
      <div class="verdict-line" id="verdict-${qi}"></div>
      <div class="expl" id="expl-${qi}">💡 ${Q.e}</div>
    </div>`;
  });
  quizEl.innerHTML = html;

  quizEl.querySelectorAll('.qcard').forEach(card => {
    const qi = parseInt(card.dataset.qi);
    card.querySelectorAll('.choice').forEach(btn => {
      btn.addEventListener('click', () => answer(qi, parseInt(btn.dataset.ci), card));
    });
  });
  quizEl.querySelectorAll('.reveal-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const ex = document.getElementById('expl-' + btn.dataset.qi);
      const showing = ex.classList.toggle('show');
      btn.textContent = showing ? '✏️ Hide model answer' : '✏️ Show model answer';
    });
  });
}

function answer(qi, ci, card) {
  const Q = QUESTIONS[qi];
  if (card.dataset.done) return;
  card.dataset.done = '1';
  answered++;
  const hit = (ci === Q.a);
  if (hit) correct++;

  card.querySelectorAll('.choice').forEach(btn => {
    const bci = parseInt(btn.dataset.ci);
    btn.disabled = true;
    if (bci === Q.a) btn.classList.add('correct');
    else if (bci === ci) btn.classList.add('wrong');
    else btn.classList.add('dim');
  });
  const v = document.getElementById('verdict-' + qi);
  v.textContent = hit ? '🎉 Correct!' : '😢 Not quite — the correct one is highlighted in green!';
  v.className = 'verdict-line ' + (hit ? 'hit' : 'miss');
  document.getElementById('expl-' + qi).classList.add('show');

  document.getElementById('score').textContent = `${correct} / ${TOTAL}`;
  document.getElementById('prog-fill').style.width = (answered / TOTAL * 100) + '%';

  if (answered === TOTAL) showFinal();
}

function showFinal() {
  const fb = document.getElementById('final-banner');
  document.getElementById('final-score').textContent = `Results! ${correct} / ${TOTAL} correct`;
  const rate = correct / TOTAL;
  let msg;
  if (rate === 1) msg = 'Perfect! 🏆 You\'ve earned the title of Atom Master.';
  else if (rate >= 0.8) msg = 'Great job! Almost a clean sweep — re-read the explanations for the ones you missed.';
  else if (rate >= 0.6) msg = 'Good pace! Focus on "is there a lid?" and "does gas form?" to boost your score.';
  else msg = 'Try the <a href="index.html">simulation</a> to see the 4 experiments again, then have another go!';
  document.getElementById('final-msg').innerHTML = msg + '<br>🔬 <a href="index.html">Review with the simulation</a>';
  fb.classList.add('show');
  fb.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ===== 解答表示モード ===== */
const ansToggle = document.getElementById('ans-toggle');
function setAnswerMode(on) {
  document.body.classList.toggle('show-answers', on);
  ansToggle.classList.toggle('on', on);
  ansToggle.textContent = on ? '🔑 Showing answers (click to hide)' : '🔑 Teacher: show answers';
}
ansToggle.addEventListener('click', () => setAnswerMode(!document.body.classList.contains('show-answers')));

render();
if (new URLSearchParams(location.search).get('ans') === '1') setAnswerMode(true);
</script>
</body>
</html>
